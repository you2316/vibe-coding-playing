      {id:'hotel',name:'武夷山鸿林大酒店',kind:'住宿',icon:'⌂',meta:'已预订 · 位置以订单为准',coords:[117.98745,27.64115],coordinateSystem:'amap',desc:'已确认住宿。公开地图结果里有同音的“泓林大酒店”（九曲溪路 65 号）；请以预订订单的酒店名称和地址核对，避免定位错店。到达南平市站较晚，建议提前确认夜间接驳。',source:'https://ditu.amap.com/place/B0FFGE5CIF',sourceLabel:'高德地图 · 酒店位置'},

    function convertToAmap(coord){return new Promise(resolve=>window.AMap.convertFrom(coord,'gps',(status,result)=>resolve(result?.info==='ok'?result.locations[0]:coord)))}
    async function loadAmap(){const response=await fetch('/api/amap-config',{cache:'no-store'});if(!response.ok)throw new Error('AMap credentials are not configured');const config=await response.json();if(!config.key||!config.securityJsCode)throw new Error('AMap credentials are incomplete');window._AMapSecurityConfig={securityJsCode:config.securityJsCode};await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=`https://webapi.amap.com/maps?v=2.1Beta&key=${encodeURIComponent(config.key)}&plugin=AMap.ControlBar,AMap.ToolBar,AMap.Scale,AMap.Buildings,AMap.Walking,AMap.Driving`;script.onload=resolve;script.onerror=()=>reject(new Error('AMap SDK could not be loaded'));document.head.append(script)});return window.AMap}
    async function initAmap(){const AMap=await loadAmap();mapProvider='amap';const center=await convertToAmap([117.966,27.654]);for(const loc of locations)loc.mapCoords=loc.coordinateSystem==='amap'?loc.coords:await convertToAmap(loc.coords);const buildings=new AMap.Buildings({zooms:[16,20],heightFactor:1});map=new AMap.Map('map',{center,zoom:13.8,pitch:62,rotation:342,viewMode:'3D',terrain:true,features:['bg','point','road','building'],showBuildingBlock:false,showIndoorMap:false,layers:[AMap.createDefaultLayer(),buildings],mapStyle:'amap://styles/normal',zoomEnable:true,dragEnable:true,rotateEnable:true,pitchEnable:true,resizeEnable:true});map.on('complete',()=>{markers=locations.map(makeMarker);applyMarkerVisibility();fitScenicView();map.resize();if(activeDay)drawDayRoute()})}
    async function initMapLibreFallback(){mapProvider='maplibre';maplibregl??=await import('https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs');map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[117.966,27.654],zoom:12.7,pitch:62,bearing:-18,antialias:true,hash:false,attributionControl:true,cooperativeGestures:true});map.on('load',()=>{try{map.addSource('terrain-dem',{type:'raster-dem',url:'https://tiles.mapterhorn.com/tilejson.json',tileSize:256});map.setTerrain({source:'terrain-dem',exaggeration:1.25});map.setFog({color:'#f4e9cf',highColor:'#dce8d8',spaceColor:'#b9d7cc',horizonBlend:.18})}catch(e){console.warn('3D terrain unavailable',e)}try{if(map.getSource('openmaptiles'))map.addLayer({id:'travel-buildings-3d',source:'openmaptiles','source-layer':'building',type:'fill-extrusion',minzoom:14,paint:{'fill-extrusion-color':'#d7c7a8','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],8],'fill-extrusion-base':['coalesce',['get','render_min_height'],['get','min_height'],0],'fill-extrusion-opacity':.82}})}catch(e){console.warn('3D building layer unavailable',e)}markers=locations.map(makeMarker);applyMarkerVisibility();fitScenicView();map.resize();if(activeDay)drawDayRoute()});map.on('error',e=>{console.warn('Map resource error',e.error||e);if(!map.isStyleLoaded()){document.querySelector('#mapShell').classList.add('maplibre-error');renderFallbackPins()}});map.on('styledata',()=>{if(map.isStyleLoaded())document.querySelector('#mapShell').classList.remove('maplibre-error')})}
    async function initMap(){if(map)return;try{await initAmap()}catch(error){console.warn('AMap unavailable; keeping the open map fallback',error);try{await initMapLibreFallback()}catch(fallbackError){console.error(fallbackError);document.querySelector('#mapShell').classList.add('maplibre-error');renderFallbackPins()}}}
    document.querySelector('#openMap').addEventListener('click',()=>{history.pushState({wuyiMap:true},'','#map');clearDayRoute();activeDay=null;selected.clear();home.style.display='none';mapView.classList.add('active');applyMarkerVisibility();initMap().then(()=>{map?.resize();applyMarkerVisibility();fitScenicView()})});
    function leaveMap(){const wasDay=!!activeDay;activeDay=null;clearDayRoute();mapView.classList.remove('active');if(wasDay){home.style.display='none';openModal(memories.postcard)}else home.style.display=''}
    window.addEventListener('popstate',()=>{if(mapView.classList.contains('active'))leaveMap()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mapView.classList.contains('active'))history.back()});
  </script>
